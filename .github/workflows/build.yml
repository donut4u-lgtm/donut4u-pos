name: Build donut4u pos APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/donut4u.jks"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/donut4u.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/debug/app-debug.apk donut4u-pos.apk

      - name: Save error summary (only when the build fails)
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/errs"
          grep -E "^e: |error:|What went wrong|Caused by|Could not|FAILED" "$RUNNER_TEMP/build.log" | head -80 > "$RUNNER_TEMP/errs/build-errors.txt" || true
          cd "$RUNNER_TEMP/errs"
          git init -q
          git checkout -q -b build-log
          git add build-errors.txt
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "build errors"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-log

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: donut4u pos build ${{ github.run_number }}
          files: donut4u-pos.apk
